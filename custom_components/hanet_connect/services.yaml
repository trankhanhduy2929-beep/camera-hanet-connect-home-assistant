  fields:
    person_id:
      name: Mã FaceID
      required: true
      selector:
        text:
    name:
      name: Tên hiển thị
      required: false
      selector:
        text:
    place_id:
      name: Mã địa điểm
      required: false
      selector:
        text:
    image_path:
      name: Ảnh khuôn mặt mới
      required: false
      selector:
        text:
    person_type:
      name: Loại hồ sơ
      required: false
      selector:
        select:
          options:
            - label: Nhân viên
              value: "0"
            - label: Khách
              value: "1"
    alias_id:
      name: Mã nhân sự
      required: false
      selector:
        text:
    department_id:
      name: Mã phòng ban
      required: false
      selector:
        text:

faceid_delete:
  name: Xóa FaceID
  description: Xóa một hồ sơ FaceID khỏi HANET Cloud.
  fields:
    person_id:
      name: Mã FaceID
      required: true
      selector:
        text:
    place_id:
      name: Mã địa điểm
      required: false
      selector:
        text:

