      name: Loại hồ sơ
      required: false
      default: "0"
      selector:
        select:
          options:
            - label: Nhân viên
              value: "0"
            - label: Khách
              value: "1"
    department_id:
      name: Mã phòng ban
      required: false
      selector:
        text:
